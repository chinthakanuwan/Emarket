<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ads - Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">My Ads</h1>
            <div class="flex gap-3">
                <a href="post-ad.html" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-orange-600">+ New Ad</a>
                <a href="index.html" class="text-gray-600 font-bold px-4 py-2 hover:bg-gray-100 rounded-lg">Home</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div id="myAdsList" class="space-y-4">
            <div class="text-center py-20 text-gray-400">Loading your ads...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "login.html"; return; }
            
            db.collection('ads').where('sellerUid', '==', user.uid).orderBy('createdAt', 'desc').onSnapshot(snap => {
                const list = document.getElementById('myAdsList');
                if (snap.empty) {
                    list.innerHTML = `
                        <div class="bg-white p-10 rounded-xl shadow text-center">
                            <i class="fas fa-inbox text-4xl text-gray-300 mb-4"></i>
                            <p class="text-gray-500">You haven't posted any ads yet.</p>
                            <a href="post-ad.html" class="inline-block mt-4 text-blue-600 font-bold hover:underline">Post your first ad</a>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = snap.docs.map(doc => {
                    const ad = doc.data();
                    let statusColor = 'bg-gray-100 text-gray-600';
                    let statusText = 'Pending Review';
                    
                    if (ad.status === 'approved') {
                        statusColor = 'bg-green-100 text-green-700';
                        statusText = 'Live / Approved';
                    } else if (ad.status === 'rejected') {
                        statusColor = 'bg-red-100 text-red-700';
                        statusText = 'Rejected';
                    }

                    return `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4 items-center">
                            <img src="${ad.images[0]}" class="w-20 h-20 object-cover rounded-lg bg-gray-200">
                            <div class="flex-grow">
                                <h3 class="font-bold text-gray-800">${ad.title}</h3>
                                <p class="text-blue-600 font-bold">Rs. ${Number(ad.price).toLocaleString()}</p>
                                <span class="inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded ${statusColor}">${statusText}</span>
                            </div>
                            <div class="flex flex-col gap-2">
                                <a href="ad-details.html?id=${doc.id}" target="_blank" class="text-blue-500 text-xs font-bold hover:underline text-center">View</a>
                                <button onclick="deleteAd('${doc.id}')" class="text-red-500 text-xs font-bold hover:bg-red-50 px-2 py-1 rounded">Delete</button>
                            </div>
                        </div>
                    `;
                }).join('');
            });
        });

        async function deleteAd(id) {
            if(confirm("Are you sure you want to delete this ad?")) {
                await db.collection('ads').doc(id).delete();
            }
        }
    </script>
</body>
</html>
