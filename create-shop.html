<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Shop - Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">🏪 බේ Shop එක සාදන්න</h1>
            <p class="text-sm text-gray-500 mt-1">Emarket හි ඔබේම වෙළඳසැලක් ආරම්භ කරන්න</p>
        </div>

        <form id="createShopForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Shop නම</label>
                <input type="text" id="shopName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="දා: My Fashion Store" required>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Shop විස්තරය</label>
                <textarea id="shopDesc" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none h-24 resize-none" placeholder="බේ Shop එක ගැන කෙටි විස්තරයක්..." required></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Category</label>
                <select id="shopCategory" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none bg-white" required>
                    <option value="">තෝරන්න...</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Home">Home & Living</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Food">Food & Grocery</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 transition shadow-md">
                Shop එක සාදන්න
            </button>
        </form>

        <p id="msg" class="text-center mt-4 text-sm font-medium min-h-[20px]"></p>
        <a href="shop.html" class="block text-center mt-4 text-blue-600 text-sm hover:underline">← Shop එකට ආපසු යන්න</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check if user is logged in
        auth.onAuthStateChanged(user => {
            if (!user) {
                alert("Shop එකක් සෑදීමට පළමුව ලොග් වන්න!");
                window.location.href = "login.html";
            }
        });

        document.getElementById('createShopForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            
            btn.disabled = true;
            btn.innerText = "සාදමින්...";
            msg.innerText = "";

            try {
                // Save Shop to Firestore
                await db.collection('shops').add({
                    ownerUid: user.uid,
                    ownerEmail: user.email,
                    name: document.getElementById('shopName').value,
                    desc: document.getElementById('shopDesc').value,
                    category: document.getElementById('shopCategory').value,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isActive: true
                });

                msg.innerText = "✅ Shop එක සාර්ථකව සාදන ලදී!";
                msg.className = "text-center mt-4 text-sm font-medium text-green-600";
                
                setTimeout(() => {
                    window.location.href = "shop.html";
                }, 1500);

            } catch (err) {
                msg.innerText = "දෝෂයක්: " + err.message;
                msg.className = "text-center mt-4 text-sm font-medium text-red-600";
                btn.disabled = false;
                btn.innerText = "Shop එක සාදන්න";
            }
        });
    </script>
</body>
</html>
