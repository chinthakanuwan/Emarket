<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sample Ads - Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-2xl w-full">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-database text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Add Sample Ads</h1>
            <p class="text-gray-500 mt-2">Click the button to automatically add ads to Firestore</p>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="mb-6">
            <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4">
                <p class="text-yellow-800 font-medium">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    Please login first to add ads
                </p>
            </div>
            <div class="space-y-4">
                <input type="email" id="loginEmail" placeholder="Email" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="password" id="loginPassword" placeholder="Password" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </div>
        </div>

        <!-- Add Ads Section -->
        <div id="addAdsSection" class="hidden">
            <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                <p class="text-green-800 font-medium">
                    <i class="fas fa-check-circle mr-2"></i>
                    Logged in as: <span id="userEmail" class="font-bold"></span>
                </p>
            </div>

            <div class="space-y-4">
                <button onclick="addSingleAd()" class="w-full bg-blue-600 text-white py-4 rounded-lg font-bold hover:bg-blue-700 transition">
                    <i class="fas fa-plus mr-2"></i>Add 1 Sample Ad
                </button>

                <button onclick="addMultipleAds()" class="w-full bg-purple-600 text-white py-4 rounded-lg font-bold hover:bg-purple-700 transition">
                    <i class="fas fa-layer-group mr-2"></i>Add 10 Sample Ads
                </button>

                <button onclick="deleteAllAds()" class="w-full bg-red-600 text-white py-4 rounded-lg font-bold hover:bg-red-700 transition">
                    <i class="fas fa-trash mr-2"></i>Delete All Ads
                </button>
            </div>

            <!-- Status -->
            <div id="statusMessage" class="mt-6 hidden">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <p class="text-blue-800" id="statusText"></p>
                </div>
            </div>

            <!-- Added Ads List -->
            <div id="addedAdsList" class="mt-6 space-y-2"></div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;

        // Check Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('addAdsSection').classList.remove('hidden');
                document.getElementById('userEmail').textContent = user.email;
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('addAdsSection').classList.add('hidden');
            }
        });

        // Login
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                showStatus('✅ Login successful!', 'success');
            } catch (error) {
                showStatus('❌ Login failed: ' + error.message, 'error');
            }
        }

        // Add Single Ad
        async function addSingleAd() {
            showStatus(' Adding ad...', 'info');
            
            try {
                const adData = {
                    title: "Toyota Prius 2012",
                    category: "Vehicles",
                    price: 8500000,
                    location: "Colombo",
                    desc: "Well maintained hybrid vehicle. Low mileage. Full options. First owner.",
                    images: ["https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=400"],
                    status: "approved",
                    isPremium: true,
                    phone: "0771234567",
                    sellerEmail: currentUser.email,
                    sellerUid: currentUser.uid,
                    views: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                const docRef = await db.collection('ads').add(adData);
                showStatus(`✅ Ad added successfully! ID: ${docRef.id}`, 'success');
                displayAddedAd(docRef.id, adData);
                
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }

        // Add Multiple Ads
        async function addMultipleAds() {
            showStatus('🔄 Adding 10 sample ads...', 'info');
            
            const sampleAds = [
                {
                    title: "Toyota Prius 2012",
                    category: "Vehicles",
                    price: 8500000,
                    location: "Colombo",
                    desc: "Well maintained hybrid vehicle. Low mileage.",
                    images: ["https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=400"],
                    status: "approved",
                    isPremium: true
                },
                {
                    title: "Land for Sale",
                    category: "Property",
                    price: 15000000,
                    location: "Kandy",
                    desc: "20 perches. Clear documents. Road access.",
                    images: ["https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=400"],
                    status: "approved",
                    isPremium: false
                },
                {
                    title: "iPhone 13 Pro",
                    category: "Mobiles",
                    price: 280000,
                    location: "Gampaha",
                    desc: "Used, good condition. 256GB. Original box.",
                    images: ["https://images.unsplash.com/photo-1632661674596-df8be070a5c5?w=400"],
                    status: "approved",
                    isPremium: true
                },
                {
                    title: "Honda Dio 2020",
                    category: "Vehicles",
                    price: 450000,
                    location: "Negombo",
                    desc: "First owner. Low mileage. Excellent condition.",
                    images: ["https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=400"],
                    status: "approved",
                    isPremium: false
                },
                {
                    title: "Samsung 55\" TV",
                    category: "Electronics",
                    price: 120000,
                    location: "Dehiwala",
                    desc: "Smart TV. 4K. 1 year warranty.",
                    images: ["https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=400"],
                    status: "approved",
                    isPremium: false
                },
                {
                    title: "Apartment for Rent",
                    category: "Property",
                    price: 85000,
                    location: "Colombo 03",
                    desc: "3 Bedrooms. 2 Bathrooms. Fully furnished.",
                    images: ["https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=400"],
                    status: "approved",
                    isPremium: true
                },
                {
                    title: "Hotel Stay Package",
                    category: "Hotels",
                    price: 35000,
                    location: "Colombo",
                    desc: "2 Nights. Breakfast included. Sea view.",
                    images: ["https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400"],
                    status: "approved",
                    isPremium: false
                },
                {
                    title: "Best Kottu",
                    category: "Restaurants",
                    price: 650,
                    location: "Havelock",
                    desc: "Chicken Kottu. Special recipe. Large portion.",
                    images: ["https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400"],
                    status: "approved",
                    isPremium: false
                },
                {
                    title: "Software Engineer Job",
                    category: "Jobs",
                    price: 150000,
                    location: "Remote",
                    desc: "Full stack developer. React, Node.js. Remote work.",
                    images: ["https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400"],
                    status: "approved",
                    isPremium: true
                },
                {
                    title: "Designer Handbag",
                    category: "Fashion",
                    price: 15000,
                    location: "Pettah",
                    desc: "Imported. Genuine leather. Brand new.",
                    images: ["https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"],
                    status: "approved",
                    isPremium: false
                }
            ];

            try {
                const batch = db.batch();
                const addedIds = [];

                sampleAds.forEach(ad => {
                    const ref = db.collection('ads').doc();
                    batch.set(ref, {
                        ...ad,
                        phone: "0771234567",
                        sellerEmail: currentUser.email,
                        sellerUid: currentUser.uid,
                        views: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    addedIds.push({ id: ref.id, ...ad });
                });

                await batch.commit();
                showStatus(`✅ Successfully added ${sampleAds.length} ads!`, 'success');
                
                addedIds.forEach(ad => displayAddedAd(ad.id, ad));
                
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }

        // Delete All Ads
        async function deleteAllAds() {
            if (!confirm('⚠️ Are you sure you want to delete ALL ads? This cannot be undone!')) {
                return;
            }

            showStatus('🔄 Deleting all ads...', 'info');

            try {
                const snapshot = await db.collection('ads').get();
                const batch = db.batch();
                
                snapshot.docs.forEach(doc => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
                showStatus(`✅ Deleted ${snapshot.size} ads successfully!`, 'success');
                document.getElementById('addedAdsList').innerHTML = '';
                
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
            }
        }

        // Display Added Ad
        function displayAddedAd(id, ad) {
            const list = document.getElementById('addedAdsList');
            const adElement = document.createElement('div');
            adElement.className = 'bg-gray-50 border border-gray-200 rounded-lg p-3 flex items-center justify-between';
            adElement.innerHTML = `
                <div class="flex-1">
                    <p class="font-bold text-gray-800 text-sm">${ad.title}</p>
                    <p class="text-xs text-gray-500">ID: ${id}</p>
                </div>
                <a href="ad-details.html?id=${id}" target="_blank" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700">
                    <i class="fas fa-external-link-alt mr-1"></i>View
                </a>
            `;
            list.appendChild(adElement);
        }

        // Show Status
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            
            statusDiv.classList.remove('hidden');
            statusText.textContent = message;
            
            const colors = {
                success: 'bg-green-50 border-green-200 text-green-800',
                error: 'bg-red-50 border-red-200 text-red-800',
                info: 'bg-blue-50 border-blue-200 text-blue-800'
            };
            
            statusDiv.firstElementChild.className = `${colors[type]} border rounded-lg p-4`;
            
            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
