<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">

    <!-- Admin Login Section -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
            <h1 class="text-3xl font-bold text-center text-red-600 mb-2"> Admin Panel</h1>
            <p class="text-center text-gray-500 mb-6 text-sm">Emarket පරිපාලක පද්ධතිය</p>

            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="adminEmail" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" placeholder="chinthaka36@gmail.com" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">මුරපදය</label>
                    <input type="password" id="adminPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 transition font-semibold">Admin ලොග් වන්න</button>
            </form>
            <p id="loginMessage" class="text-center mt-4 text-sm font-medium"></p>
            <p class="text-center mt-4 text-sm"><a href="index.html" class="text-blue-600 hover:underline">← සාමාන්‍ය පිටුවට</a></p>
        </div>
    </div>

    <!-- Admin Dashboard Section -->
    <div id="dashboardSection" class="hidden min-h-screen">
        <!-- Header -->
        <header class="bg-red-600 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">Emarket Admin</h1>
                    <p class="text-sm text-red-200" id="adminEmailDisplay"></p>
                </div>
                <button id="logoutBtn" class="bg-white text-red-600 px-4 py-2 rounded-lg hover:bg-red-50 font-semibold">Logout</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container mx-auto p-4">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm mb-1">සියලුම Users</p>
                            <p id="totalUsers" class="text-4xl font-bold text-blue-600">0</p>
                        </div>
                        <div class="bg-blue-100 p-3 rounded-full">👥</div>
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm mb-1">Products</p>
                            <p id="totalProducts" class="text-4xl font-bold text-green-600">0</p>
                        </div>
                        <div class="bg-green-100 p-3 rounded-full"></div>
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-lg shadow">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm mb-1">Orders</p>
                            <p id="totalOrders" class="text-4xl font-bold text-purple-600">0</p>
                        </div>
                        <div class="bg-purple-100 p-3 rounded-full">🛒</div>
                    </div>
                </div>
            </div>

            <!-- Users List -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800">ලියාපදිංචි වූ පරිශීලකයින්</h2>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">නම</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Email</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">වර්ගය</th>
                                <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">ලියාපදිංචි දිනය</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="4" class="px-4 py-8 text-center text-gray-500">පුරනය වෙමින්...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Products Section -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-4 text-gray-800">විකිණීමට ඇති භාණ්ඩ</h2>
                <div id="productsList" class="space-y-2">
                    <p class="text-gray-500 text-center py-8">තවම products නැත</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b",
            measurementId: "G-LYM94LMHXC"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Admin Login Form Handler
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const msg = document.getElementById('loginMessage');
            
            msg.innerText = "පුරනය වෙමින්...";
            msg.className = "text-center mt-4 text-sm font-medium text-blue-600";

            try {
                // Sign in with Firebase Auth
                await auth.signInWithEmailAndPassword(email, password);
                
                // Check if user is admin in Firestore
                const userDoc = await db.collection('users').doc(auth.currentUser.uid).get();
                
                if (userDoc.exists && userDoc.data().userType === 'admin') {
                    // Show dashboard
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    document.getElementById('adminEmailDisplay').innerText = email;
                    
                    // Load dashboard data
                    loadDashboardData();
                    
                    msg.innerText = "";
                } else {
                    // Not an admin - sign out
                    await auth.signOut();
                    msg.innerText = "️ ඔබට Admin ප්රවේශය නැත!";
                    msg.className = "text-center mt-4 text-sm font-medium text-red-600";
                }
            } catch (error) {
                msg.innerText = "දෝෂයක්: " + error.message;
                msg.className = "text-center mt-4 text-sm font-medium text-red-600";
                console.error("Login error:", error);
            }
        });

        // Logout Handler
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            await auth.signOut();
            location.reload();
        });

        // Load Dashboard Data
        function loadDashboardData() {
            // Load Users
            db.collection('users').onSnapshot((snapshot) => {
                const users = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                document.getElementById('totalUsers').innerText = users.length;
                
                const tableBody = document.getElementById('usersTableBody');
                if (users.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">කිසිදු user කෙනෙක් නැත</td></tr>';
                } else {
                    tableBody.innerHTML = users.map(user => {
                        const date = user.createdAt ? new Date(user.createdAt.seconds * 1000).toLocaleDateString('si-LK') : 'N/A';
                        const userTypeClass = user.userType === 'admin' ? 'bg-red-100 text-red-800' : 'bg-blue-100 text-blue-800';
                        const userTypeText = user.userType === 'admin' ? 'Admin' : 'Buyer';
                        
                        return `
                            <tr class="hover:bg-gray-50">
                                <td class="px-4 py-3 text-sm font-medium text-gray-900">${user.fullName || 'N/A'}</td>
                                <td class="px-4 py-3 text-sm text-gray-600">${user.email}</td>
                                <td class="px-4 py-3">
                                    <span class="px-2 py-1 text-xs font-semibold rounded-full ${userTypeClass}">${userTypeText}</span>
                                </td>
                                <td class="px-4 py-3 text-sm text-gray-600">${date}</td>
                            </tr>
                        `;
                    }).join('');
                }
            }, (error) => {
                console.error("Error loading users:", error);
            });

            // Load Products
            db.collection('products').onSnapshot((snapshot) => {
                document.getElementById('totalProducts').innerText = snapshot.size;
                
                const productsList = document.getElementById('productsList');
                if (snapshot.empty) {
                    productsList.innerHTML = '<p class="text-gray-500 text-center py-8">තවම products නැත</p>';
                } else {
                    const products = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                    productsList.innerHTML = products.map(product => `
                        <div class="border p-3 rounded-lg flex justify-between items-center">
                            <div>
                                <p class="font-semibold">${product.name || 'N/A'}</p>
                                <p class="text-sm text-gray-500">රු. ${product.price || '0'}</p>
                            </div>
                            <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">Active</span>
                        </div>
                    `).join('');
                }
            }, (error) => {
                console.error("Error loading products:", error);
            });

            // Load Orders
            db.collection('orders').onSnapshot((snapshot) => {
                document.getElementById('totalOrders').innerText = snapshot.size;
            }, (error) => {
                console.error("Error loading orders:", error);
            });
        }

        // Check if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists && userDoc.data().userType === 'admin') {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    document.getElementById('adminEmailDisplay').innerText = user.email;
                    loadDashboardData();
                }
            }
        });
    </script>
</body>
</html>
