<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-gray-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-shield-alt mr-2"></i> Admin Dashboard</h1>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-bold">Logout</button>
        </div>
    </header>

    <div class="container mx-auto p-6 max-w-6xl">
        
        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-yellow-500">
                <p class="text-gray-500 text-xs uppercase font-bold">Pending Ads</p>
                <p class="text-2xl font-bold text-gray-800" id="countPending">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-xs uppercase font-bold">Approved Ads</p>
                <p class="text-2xl font-bold text-gray-800" id="countApproved">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-purple-500">
                <p class="text-gray-500 text-xs uppercase font-bold">Premium Ads</p>
                <p class="text-2xl font-bold text-gray-800" id="countPremium">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-xs uppercase font-bold">Total Users</p>
                <p class="text-2xl font-bold text-gray-800" id="countUsers">0</p>
            </div>
        </div>

        <!-- Pending Approvals Section -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
            <div class="p-4 bg-yellow-50 border-b border-yellow-100 flex justify-between items-center">
                <h2 class="font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-clock text-yellow-600"></i> Pending Approvals</h2>
                <span class="bg-yellow-200 text-yellow-800 text-xs px-2 py-1 rounded-full font-bold" id="pendingBadge">0</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                        <tr>
                            <th class="p-4">Ad Details</th>
                            <th class="p-4">Seller</th>
                            <th class="p-4">Price</th>
                            <th class="p-4">Type</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pendingTableBody" class="divide-y divide-gray-100 text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-gray-400">Checking for pending ads...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Recent Approved Ads -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="p-4 bg-green-50 border-b border-green-100">
                <h2 class="font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-check-circle text-green-600"></i> Recently Approved Ads</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-xs uppercase">
                        <tr>
                            <th class="p-4">Title</th>
                            <th class="p-4">Category</th>
                            <th class="p-4">Premium</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="approvedTableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Security Check
        auth.onAuthStateChanged(async user => {
            if (!user) { window.location.href = "login.html"; return; }
            const doc = await db.collection('users').doc(user.uid).get();
            if (!doc.exists || doc.data().userType !== 'admin') {
                alert("Access Denied!");
                window.location.href = "index.html";
            } else {
                loadData();
            }
        });

        function logout() { auth.signOut().then(() => window.location.href = "index.html"); }

        function loadData() {
            // Pending Ads
            db.collection('ads').where('status', '==', 'pending').orderBy('createdAt', 'desc').onSnapshot(snap => {
                document.getElementById('countPending').innerText = snap.size;
                document.getElementById('pendingBadge').innerText = snap.size;
                
                const tbody = document.getElementById('pendingTableBody');
                if (snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">No pending ads. Great job!</td></tr>';
                    return;
                }
                
                tbody.innerHTML = snap.docs.map(doc => {
                    const ad = doc.data();
                    return `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <img src="${ad.images[0]}" class="w-12 h-12 rounded object-cover bg-gray-200">
                                    <div>
                                        <p class="font-bold text-gray-800">${ad.title}</p>
                                        <p class="text-xs text-gray-500">${ad.category} • ${ad.location}</p>
                                    </div>
                                </div>
                            </td>
                            <td class="p-4 text-gray-600">${ad.sellerEmail}</td>
                            <td class="p-4 font-bold text-blue-600">Rs. ${Number(ad.price).toLocaleString()}</td>
                            <td class="p-4">
                                ${ad.isPremium ? '<span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded font-bold">PREMIUM</span>' : '<span class="text-gray-400 text-xs">Free</span>'}
                            </td>
                            <td class="p-4 text-right space-x-2">
                                <button onclick="approveAd('${doc.id}')" class="bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-green-700">Approve</button>
                                <button onclick="rejectAd('${doc.id}')" class="bg-red-100 text-red-600 px-3 py-1.5 rounded text-xs font-bold hover:bg-red-200">Reject</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            });

            // Approved Ads Count & List
            db.collection('ads').where('status', '==', 'approved').get().then(snap => {
                document.getElementById('countApproved').innerText = snap.size;
                const tbody = document.getElementById('approvedTableBody');
                tbody.innerHTML = snap.docs.slice(0, 5).map(doc => {
                    const ad = doc.data();
                    return `
                        <tr>
                            <td class="p-4 font-medium text-gray-800">${ad.title}</td>
                            <td class="p-4 text-gray-500">${ad.category}</td>
                            <td class="p-4">${ad.isPremium ? 'Yes' : 'No'}</td>
                            <td class="p-4 text-right">
                                <button onclick="togglePremium('${doc.id}', ${!ad.isPremium})" class="text-blue-600 hover:underline text-xs font-bold">
                                    ${ad.isPremium ? 'Remove Premium' : 'Make Premium'}
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            });

            // Premium Count
            db.collection('ads').where('isPremium', '==', true).get().then(snap => {
                document.getElementById('countPremium').innerText = snap.size;
            });

            // Users Count
            db.collection('users').get().then(snap => {
                document.getElementById('countUsers').innerText = snap.size;
            });
        }

        async function approveAd(id) {
            if(confirm("Approve this ad? It will be visible to public.")) {
                await db.collection('ads').doc(id).update({ status: 'approved' });
            }
        }

        async function rejectAd(id) {
            if(confirm("Reject and delete this ad?")) {
                await db.collection('ads').doc(id).delete();
            }
        }

        async function togglePremium(id, status) {
            await db.collection('ads').doc(id).update({ isPremium: status });
        }
    </script>
</body>
</html>
