<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Login Section (Visible initially) -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-100">
            <h1 class="text-3xl font-bold text-center text-red-600 mb-2">🔐 Admin Panel</h1>
            <p class="text-center text-gray-500 mb-6 text-sm">Emarket පරිපාලක පද්ධතිය</p>

            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Admin Email</label>
                    <input type="email" id="adminEmail" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" placeholder="chinthaka36@gmail.com" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">මුරපදය</label>
                    <input type="password" id="adminPassword" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 transition font-bold shadow-md">Admin ලොග් වන්න</button>
            </form>
            <p id="loginMessage" class="text-center mt-4 text-sm font-medium min-h-[20px]"></p>
            <p class="text-center mt-6 text-sm"><a href="index.html" class="text-blue-600 hover:underline">← සාමාන්‍ය පිටුවට</a></p>
        </div>
    </div>

    <!-- Dashboard Section (Hidden initially) -->
    <div id="dashboardSection" class="hidden min-h-screen">
        <header class="bg-red-600 text-white p-4 shadow-lg sticky top-0 z-50">
            <div class="container mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold">Emarket Admin</h1>
                    <p class="text-xs text-red-200" id="adminEmailDisplay"></p>
                </div>
                <button id="logoutBtn" class="bg-white text-red-600 px-4 py-2 rounded-lg hover:bg-red-50 font-bold text-sm shadow-sm">Logout</button>
            </div>
        </header>

        <div class="container mx-auto p-4 max-w-5xl">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-500 text-sm mb-1 font-medium">සියලුම Users</p>
                    <p id="totalUsers" class="text-4xl font-extrabold text-blue-600">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-500 text-sm mb-1 font-medium">Products</p>
                    <p id="totalProducts" class="text-4xl font-extrabold text-green-600">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-500 text-sm mb-1 font-medium">Orders</p>
                    <p id="totalOrders" class="text-4xl font-extrabold text-purple-600">0</p>
                </div>
            </div>

            <!-- Users Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-gray-800">ලියාපදිංචි වූ පරිශීලකයින්</h2>
                    <a href="admin-products.html" class="text-sm text-blue-600 hover:underline font-medium">Manage Products →</a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase">නම</th>
                                <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Email</th>
                                <th class="px-6 py-3 text-xs font-semibold text-gray-500 uppercase">වර්ගය</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody" class="divide-y divide-gray-100">
                            <tr><td colspan="3" class="px-6 py-8 text-center text-gray-400">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Admin Login
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const msg = document.getElementById('loginMessage');
            
            msg.innerText = "පරීක්ෂා කරමින්...";
            msg.className = "text-center mt-4 text-sm font-medium text-blue-600";

            try {
                await auth.signInWithEmailAndPassword(email, password);
                const userDoc = await db.collection('users').doc(auth.currentUser.uid).get();
                
                if (userDoc.exists && userDoc.data().userType === 'admin') {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    document.getElementById('adminEmailDisplay').innerText = email;
                    loadDashboardData();
                    msg.innerText = "";
                } else {
                    await auth.signOut();
                    msg.innerText = "⛔ ඔබට Admin ප්‍රවේශය නැත!";
                    msg.className = "text-center mt-4 text-sm font-medium text-red-600";
                }
            } catch (error) {
                msg.innerText = "දෝෂයක්: " + error.message;
                msg.className = "text-center mt-4 text-sm font-medium text-red-600";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut().then(() => location.reload()));

        function loadDashboardData() {
            db.collection('users').onSnapshot(snap => {
                const users = snap.docs.map(d => ({id: d.id, ...d.data()}));
                document.getElementById('totalUsers').innerText = users.length;
                
                const tbody = document.getElementById('usersTableBody');
                if(users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-gray-400">No users found</td></tr>';
                } else {
                    tbody.innerHTML = users.map(u => `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 text-sm font-medium text-gray-900">${u.fullName || 'N/A'}</td>
                            <td class="px-6 py-4 text-sm text-gray-500">${u.email}</td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 text-xs font-bold rounded-full ${u.userType === 'admin' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}">
                                    ${u.userType || 'customer'}
                                </span>
                            </td>
                        </tr>
                    `).join('');
                }
            });

            db.collection('products').onSnapshot(snap => document.getElementById('totalProducts').innerText = snap.size);
            db.collection('orders').onSnapshot(snap => document.getElementById('totalOrders').innerText = snap.size);
        }

        // Check if already logged in as admin
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists && doc.data().userType === 'admin') {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');
                    document.getElementById('adminEmailDisplay').innerText = user.email;
                    loadDashboardData();
                }
            }
        });
    </script>
</body>
</html>
