<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Emarket</h1>
            <a href="index.html" class="text-sm bg-blue-700 px-3 py-1 rounded">Login</a>
        </div>
    </nav>

    <!-- Category Filter -->
    <div class="container mx-auto p-4 overflow-x-auto whitespace-nowrap">
        <button onclick="filterProducts('All')" class="bg-gray-200 px-4 py-2 rounded-full mr-2 hover:bg-blue-100">All</button>
        <button onclick="filterProducts('Electronics')" class="bg-gray-200 px-4 py-2 rounded-full mr-2 hover:bg-blue-100">Electronics</button>
        <button onclick="filterProducts('Fashion')" class="bg-gray-200 px-4 py-2 rounded-full mr-2 hover:bg-blue-100">Fashion</button>
        <button onclick="filterProducts('Home')" class="bg-gray-200 px-4 py-2 rounded-full mr-2 hover:bg-blue-100">Home</button>
        <button onclick="filterProducts('Beauty')" class="bg-gray-200 px-4 py-2 rounded-full mr-2 hover:bg-blue-100">Beauty</button>
    </div>

    <!-- Products Grid -->
    <div class="container mx-auto p-4 grid grid-cols-2 md:grid-cols-4 gap-4" id="shopGrid">
        <!-- Products load here -->
    </div>

    <script>
        const firebaseConfig = { /* ඔයාගේ config එකම දාන්න */ 
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allProducts = [];

        db.collection('products').onSnapshot(snap => {
            allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderProducts(allProducts);
        });

        function renderProducts(list) {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = list.map(p => `
                <div class="bg-white rounded-lg shadow p-3">
                    <img src="${p.image}" class="w-full h-32 object-cover rounded mb-2 bg-gray-200">
                    <h3 class="font-bold text-sm truncate">${p.name}</h3>
                    <p class="text-xs text-gray-500">${p.category}</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-blue-600 font-bold">Rs. ${p.price}</span>
                        <button class="bg-green-500 text-white text-xs px-2 py-1 rounded">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(cat) {
            if(cat === 'All') renderProducts(allProducts);
            else renderProducts(allProducts.filter(p => p.category === cat));
        }
    </script>
</body>
</html>
