<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
        authDomain: "emarket-e3421.firebaseapp.com",
        projectId: "emarket-e3421",
        storageBucket: "emarket-e3421.firebasestorage.app",
        messagingSenderId: "1029527442178",
        appId: "1:1029527442178:web:535443f333ce6e9deda81b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let allProducts = [];

    // Auto Load Sample Data if Empty
    db.collection('products').get().then(snapshot => {
        if (snapshot.empty) {
            console.log("No products found. Adding sample data...");
            const samples = [
                { name: "iPhone 14 Pro", price: 350000, category: "Electronics", image: "https://images.unsplash.com/photo-1678685888221-cda773a3dcdb?w=400", desc: "New Apple Phone" },
                { name: "Samsung TV 55\"", price: 180000, category: "Electronics", image: "https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=400", desc: "4K Smart TV" },
                { name: "Men's T-Shirt", price: 2500, category: "Fashion", image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400", desc: "Cotton T-shirt" },
                { name: "Running Shoes", price: 8500, category: "Fashion", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", desc: "Nike Sports Shoes" },
                { name: "Coffee Maker", price: 12000, category: "Home", image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400", desc: "Automatic Coffee Machine" },
                { name: "Face Cream", price: 3500, category: "Beauty", image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=400", desc: "Moisturizing Cream" }
            ];
            
            // Add samples one by one
            samples.forEach(p => db.collection('products').add(p));
        }
    });

    // Load Products Realtime
    db.collection('products').onSnapshot(snap => {
        allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderProducts(allProducts);
    });

    function renderProducts(list) {
        const grid = document.getElementById('shopGrid');
        if(list.length === 0) {
            grid.innerHTML = '<p class="col-span-4 text-center text-gray-500">Loading products...</p>';
            return;
        }
        grid.innerHTML = list.map(p => `
            <div class="bg-white rounded-lg shadow p-3">
                <img src="${p.image}" class="w-full h-32 object-cover rounded mb-2 bg-gray-200">
                <h3 class="font-bold text-sm truncate">${p.name}</h3>
                <p class="text-xs text-gray-500">${p.category}</p>
                <div class="flex justify-between items-center mt-2">
                    <span class="text-blue-600 font-bold">Rs. ${p.price}</span>
                    <button class="bg-green-500 text-white text-xs px-2 py-1 rounded">Add to Cart</button>
                </div>
            </div>
        `).join('');
    }

    function filterProducts(cat) {
        if(cat === 'All') renderProducts(allProducts);
        else renderProducts(allProducts.filter(p => p.category === cat));
    }
</script>
