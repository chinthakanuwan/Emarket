<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-50 pb-10">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold">Emarket 🛒</a>
            <div class="flex items-center gap-3">
                <span id="userDisplay" class="text-xs bg-blue-700 px-2 py-1 rounded hidden">Hi, User</span>
                <a href="login.html" id="loginLink" class="text-sm bg-white text-blue-600 px-3 py-1 rounded-full font-semibold">Login</a>
                <button id="logoutBtn" class="text-sm bg-red-500 text-white px-3 py-1 rounded-full font-semibold hidden" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Category Filter -->
    <div class="container mx-auto p-4 overflow-x-auto whitespace-nowrap scrollbar-hide">
        <div class="flex gap-2">
            <button onclick="filterProducts('All')" class="cat-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium shadow-sm">All</button>
            <button onclick="filterProducts('Electronics')" class="cat-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-gray-100">Electronics</button>
            <button onclick="filterProducts('Fashion')" class="cat-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-gray-100">Fashion</button>
            <button onclick="filterProducts('Home')" class="cat-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-gray-100">Home</button>
            <button onclick="filterProducts('Beauty')" class="cat-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-gray-100">Beauty</button>
        </div>
    </div>

    <!-- Products Grid -->
    <div class="container mx-auto p-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="shopGrid">
        <div class="col-span-full text-center py-20 text-gray-400">Loading amazing products...</div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let allProducts = [];

        // Auto Load Sample Data if Empty
        db.collection('products').get().then(snapshot => {
            if (snapshot.empty) {
                console.log("No products found. Adding sample data automatically...");
                const samples = [
                    { name: "iPhone 14 Pro Max", price: 385000, category: "Electronics", image: "https://images.unsplash.com/photo-1678685888221-cda773a3dcdb?w=400&q=80", desc: "Deep Purple, 256GB" },
                    { name: "Samsung 55\" 4K TV", price: 185000, category: "Electronics", image: "https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=400&q=80", desc: "Crystal UHD Smart TV" },
                    { name: "Nike Air Jordan", price: 28500, category: "Fashion", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80", desc: "Red/White Classic" },
                    { name: "Cotton T-Shirt", price: 2500, category: "Fashion", image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&q=80", desc: "Premium Cotton Black" },
                    { name: "Philips Coffee Maker", price: 14500, category: "Home", image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&q=80", desc: "Automatic Drip Coffee" },
                    { name: "Nivea Face Cream", price: 3200, category: "Beauty", image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=400&q=80", desc: "Soft Moisturizing 100ml" }
                ];
                samples.forEach(p => db.collection('products').add(p));
            }
        });

        // Realtime Listener for Products
        db.collection('products').onSnapshot(snap => {
            allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderProducts(allProducts);
        });

        // Auth State Listener for UI
        auth.onAuthStateChanged(user => {
            const userDisplay = document.getElementById('userDisplay');
            const loginLink = document.getElementById('loginLink');
            const logoutBtn = document.getElementById('logoutBtn');
            
            if (user) {
                userDisplay.innerText = `Hi, ${user.email.split('@')[0]}`;
                userDisplay.classList.remove('hidden');
                loginLink.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
            } else {
                userDisplay.classList.add('hidden');
                loginLink.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }
        });

        function logout() {
            auth.signOut().then(() => window.location.reload());
        }

        function renderProducts(list) {
            const grid = document.getElementById('shopGrid');
            if(list.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500">No products available yet.</div>';
                return;
            }
            grid.innerHTML = list.map(p => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow p-3 flex flex-col h-full border border-gray-100">
                    <div class="relative">
                        <img src="${p.image}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'" class="w-full h-40 object-cover rounded-lg bg-gray-100 mb-3">
                        <span class="absolute top-2 right-2 bg-white/90 backdrop-blur text-xs font-bold px-2 py-1 rounded-md text-gray-700 shadow-sm">${p.category}</span>
                    </div>
                    <h3 class="font-bold text-gray-800 text-sm line-clamp-2 mb-1">${p.name}</h3>
                    <p class="text-xs text-gray-500 mb-3 line-clamp-1">${p.desc || ''}</p>
                    <div class="mt-auto flex justify-between items-center pt-2 border-t border-gray-50">
                        <span class="text-blue-600 font-extrabold text-lg">Rs. ${p.price.toLocaleString()}</span>
                        <button onclick="addToCart('${p.id}', '${p.name.replace(/'/g, "\\'")}')" class="bg-blue-600 text-white text-xs px-3 py-2 rounded-lg hover:bg-blue-700 transition font-medium active:scale-95">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts(cat) {
            // Update active button style
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText === cat || (cat === 'All' && btn.innerText === 'All')) {
                    btn.className = "cat-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium shadow-sm";
                } else {
                    btn.className = "cat-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm hover:bg-gray-100";
                }
            });

            if(cat === 'All') renderProducts(allProducts);
            else renderProducts(allProducts.filter(p => p.category === cat));
        }

        // Cart Logic with Auth Check
        function addToCart(id, name) {
            auth.onAuthStateChanged(user => {
                if (user) {
                    alert(`✅ "${name}" successfully added to your cart!`);
                    // Here you can add logic to save to 'carts' collection in Firestore
                } else {
                    if(confirm(" භාණ්ඩ මිලදී ගැනීමට පළමුව ලොග් වන්න හෝ ගිණුමක් සාදන්න.\n\nලොග් වීමට යන්නද?")) {
                        window.location.href = "login.html";
                    }
                }
            });
        }
    </script>
</body>
</html>
