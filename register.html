<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - ලියාපදිංචි වන්න</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">Emarket</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">අලුත් ගිණුමක් සාදන්න</p>

        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">නම</label>
                <input type="text" id="fullName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ඔබේ සම්පූර්ණ නම" required>
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="regEmail" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="example@email.com" required>
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">මුරපදය (Password)</label>
                <input type="password" id="regPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="අවම වශයෙන් අක්ෂර 6ක් වත්" required>
                <p class="text-xs text-gray-500 mt-1">අවම වශයෙන් අක්ෂර 6ක් වත් යොදන්න</p>
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">මුරපදය තහවුරු කරන්න</label>
                <input type="password" id="confirmPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="මුරපදය නැවත යොදන්න" required>
            </div>
            
            <button type="submit" id="regBtn" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-semibold">ගිණුම සාදන්න</button>
        </form>

        <p id="message" class="text-center mt-4 text-sm font-medium"></p>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">දැනටමත් ගිණුමක් තිබේද? <a href="index.html" class="text-blue-600 hover:underline">ලොග් වන්න</a></p>
        </div>
    </div>

    <script>
        // Firebase Config (ඔයාගේ config එකම දාන්න)
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b",
            measurementId: "G-LYM94LMHXC"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Register Form Submit
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageEl = document.getElementById('message');
            const btn = document.getElementById('regBtn');

            // Password validation
            if (password.length < 6) {
                messageEl.style.color = "red";
                messageEl.innerText = "මුරපදය අවම වශයෙන් අක්ෂර 6ක් වත් යොදන්න.";
                return;
            }

            if (password !== confirmPassword) {
                messageEl.style.color = "red";
                messageEl.innerText = "මුරපද දෙක ගැලපෙන්නේ නැත.";
                return;
            }

            btn.innerText = "සාදමින්...";
            btn.disabled = true;
            messageEl.innerText = "";

            // Create user with Firebase
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // User created successfully
                    const user = userCredential.user;
                    
                    // Save user name to Firestore (optional)
                    const db = firebase.firestore();
                    return db.collection('users').doc(user.uid).set({
                        fullName: fullName,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        userType: 'buyer' // default user type
                    });
                })
                .then(() => {
                    messageEl.style.color = "green";
                    messageEl.innerText = "ගිණුම සාර්ථකව සාදන ලදී! ලොග් වෙමින්...";
                    
                    // Redirect to login page after 2 seconds
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                })
                .catch((error) => {
                    messageEl.style.color = "red";
                    
                    if (error.code === 'auth/email-already-in-use') {
                        messageEl.innerText = "මේ Email ලිපිනය දැනටමත් භාවිතයේ පවතී.";
                    } else if (error.code === 'auth/weak-password') {
                        messageEl.innerText = "මුරපදය දුර්වලයි. වැඩි අක්ෂර ගණනක් යොදන්න.";
                    } else if (error.code === 'auth/invalid-email') {
                        messageEl.innerText = "වලංගු Email ලිපිනයක් යොදන්න.";
                    } else {
                        messageEl.innerText = "දෝෂයක්: " + error.message;
                    }
                    console.error("Registration Error:", error);
                })
                .finally(() => {
                    btn.innerText = "ගිණුම සාදන්න";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
