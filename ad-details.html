<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Details - Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 pb-20">

    <!-- Navbar Simplified -->
    <nav class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold text-blue-700"><i class="fas fa-arrow-left mr-2"></i> Back to Ads</a>
            <button onclick="shareAd()" class="text-gray-500 hover:text-blue-600"><i class="fas fa-share-alt text-xl"></i></button>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6 max-w-4xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Main Content -->
        <div class="lg:col-span-2 space-y-6">
            <!-- Image Gallery -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <img id="mainImage" src="" class="w-full h-64 md:h-96 object-cover bg-gray-200">
                <div id="thumbGrid" class="flex gap-2 p-2 overflow-x-auto bg-gray-50">
                    <!-- Thumbnails loaded via JS -->
                </div>
            </div>

            <!-- Ad Info -->
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span id="adCategory" class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">Category</span>
                        <h1 id="adTitle" class="text-2xl font-bold text-gray-900 mt-2">Loading...</h1>
                    </div>
                    <p id="adPrice" class="text-2xl font-extrabold text-blue-700">Rs. 0</p>
                </div>
                
                <div class="flex items-center gap-2 text-gray-500 text-sm mb-6 border-b pb-4">
                    <i class="fas fa-map-marker-alt"></i> <span id="adLocation">Location</span>
                    <span class="mx-2">•</span>
                    <i class="far fa-clock"></i> <span id="adDate">Date</span>
                </div>

                <h3 class="font-bold text-gray-800 mb-2">Description</h3>
                <p id="adDesc" class="text-gray-600 leading-relaxed whitespace-pre-line">Loading description...</p>
            </div>
        </div>

        <!-- Sidebar (Seller Info & Safety) -->
        <div class="space-y-6">
            <!-- Seller Card -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-4">Seller Information</h3>
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold text-xl">
                        <i class="fas fa-user"></i>
                    </div>
                    <div>
                        <p class="font-bold text-gray-800">Private Seller</p>
                        <p class="text-xs text-gray-500">Member since 2024</p>
                    </div>
                </div>
                
                <!-- Contact Button Logic -->
                <button id="showPhoneBtn" onclick="revealPhone()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition flex items-center justify-center gap-2">
                    <i class="fas fa-phone-alt"></i> Show Phone Number
                </button>
                <a id="phoneLink" href="#" class="hidden w-full bg-gray-100 text-gray-800 py-3 rounded-lg font-bold text-center mt-2 border border-gray-200 hover:bg-gray-200">
                    📞 Call Now
                </a>
                <p id="phoneDisplay" class="hidden text-center text-lg font-bold text-gray-800 mt-2 tracking-widest"></p>
            </div>

            <!-- Safety Tips -->
            <div class="bg-yellow-50 rounded-xl p-4 border border-yellow-100">
                <h4 class="font-bold text-yellow-800 text-sm mb-2"><i class="fas fa-shield-alt mr-1"></i> Safety Tips</h4>
                <ul class="text-xs text-yellow-700 space-y-1 list-disc pl-4">
                    <li>Meet in a public place.</li>
                    <li>Check the item before paying.</li>
                    <li>Never send money in advance.</li>
                </ul>
            </div>

            <!-- Side Ad Slot -->
            <div class="bg-gray-200 h-64 rounded-lg flex items-center justify-center text-gray-400 text-xs border-2 border-dashed border-gray-300">
                Ad Slot (300x250)
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const adId = urlParams.get('id');

        if (adId) {
            db.collection('ads').doc(adId).get().then(doc => {
                if (!doc.exists) {
                    document.body.innerHTML = "<div class='p-10 text-center'>Ad not found.</div>";
                    return;
                }
                const ad = doc.data();
                
                // Populate Data
                document.getElementById('mainImage').src = ad.images[0] || 'https://via.placeholder.com/600x400';
                document.getElementById('adTitle').innerText = ad.title;
                document.getElementById('adPrice').innerText = `Rs. ${Number(ad.price).toLocaleString()}`;
                document.getElementById('adCategory').innerText = ad.category;
                document.getElementById('adLocation').innerText = ad.location;
                document.getElementById('adDesc').innerText = ad.desc;
                document.getElementById('adDate').innerText = new Date(ad.createdAt.seconds * 1000).toLocaleDateString();

                // Thumbnails
                const thumbGrid = document.getElementById('thumbGrid');
                thumbGrid.innerHTML = ad.images.map(img => 
                    `<img src="${img}" onclick="document.getElementById('mainImage').src='${img}'" class="w-16 h-16 object-cover rounded cursor-pointer border hover:border-blue-500 transition">`
                ).join('');

                // Store Phone securely
                window.adPhone = ad.phone;

            }).catch(err => console.error(err));
        }

        function revealPhone() {
            const btn = document.getElementById('showPhoneBtn');
            const display = document.getElementById('phoneDisplay');
            const link = document.getElementById('phoneLink');
            
            btn.classList.add('hidden');
            display.innerText = window.adPhone;
            display.classList.remove('hidden');
            link.href = `tel:${window.adPhone}`;
            link.classList.remove('hidden');
            link.innerText = `📞 Call ${window.adPhone}`;
        }

        function shareAd() {
            if (navigator.share) {
                navigator.share({
                    title: document.getElementById('adTitle').innerText,
                    url: window.location.href
                });
            } else {
                alert("Link copied to clipboard!");
            }
        }
    </script>
</body>
</html>
