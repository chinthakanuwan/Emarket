<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post an Ad - Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10">

    <div class="container mx-auto px-4 max-w-2xl">
        <div class="bg-white rounded-xl shadow-lg p-6 md:p-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Post a Free Ad</h1>
            
            <form id="postAdForm" class="space-y-5">
                <!-- Category -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Category *</label>
                    <select id="adCategory" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white" required>
                        <option value="">Select Category...</option>
                        <option value="Vehicles">Vehicles (Cars, Bikes)</option>
                        <option value="Property">Property (Land, Houses)</option>
                        <option value="Mobiles">Mobile Phones</option>
                        <option value="Electronics">Electronics & Computers</option>
                        <option value="Jobs">Jobs & Services</option>
                        <option value="Fashion">Fashion & Beauty</option>
                    </select>
                </div>

                <!-- Title & Price -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Ad Title *</label>
                        <input type="text" id="adTitle" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g., Toyota Prius 2012" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Price (Rs.) *</label>
                        <input type="number" id="adPrice" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g., 5500000" required>
                    </div>
                </div>

                <!-- Location & Contact -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Location *</label>
                        <input type="text" id="adLocation" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g., Colombo 03" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Contact Phone *</label>
                        <input type="tel" id="adPhone" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="07X XXXXXXX" required>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Description *</label>
                    <textarea id="adDesc" rows="4" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="Describe your item in detail..." required></textarea>
                </div>

                <!-- Images (URLs for now) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Image URLs (Max 3)</label>
                    <input type="url" id="img1" class="w-full p-3 border rounded-lg mb-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Main Image URL *" required>
                    <div class="flex gap-2">
                        <input type="url" id="img2" class="w-1/2 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Image 2 (Optional)">
                        <input type="url" id="img3" class="w-1/2 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Image 3 (Optional)">
                    </div>
                </div>

                <!-- Premium Option -->
                <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200 flex items-start gap-3">
                    <input type="checkbox" id="isPremium" class="mt-1 w-5 h-5 text-yellow-600 rounded focus:ring-yellow-500">
                    <div>
                        <label for="isPremium" class="font-bold text-gray-800 cursor-pointer">Make this a Premium Ad (Paid)</label>
                        <p class="text-xs text-gray-600 mt-1">Get featured on the homepage and get 5x more views. (Admin will contact you for payment)</p>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-4 rounded-lg font-bold hover:bg-blue-700 transition shadow-lg text-lg">
                    Submit Ad for Approval
                </button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Auth Check
        auth.onAuthStateChanged(user => {
            if (!user) {
                alert("Please login to post an ad!");
                window.location.href = "login.html";
            }
        });

        document.getElementById('postAdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            btn.innerText = "Submitting...";

            const images = [
                document.getElementById('img1').value,
                document.getElementById('img2').value,
                document.getElementById('img3').value
            ].filter(url => url !== "");

            try {
                await db.collection('ads').add({
                    title: document.getElementById('adTitle').value,
                    price: Number(document.getElementById('adPrice').value),
                    category: document.getElementById('adCategory').value,
                    location: document.getElementById('adLocation').value,
                    phone: document.getElementById('adPhone').value,
                    desc: document.getElementById('adDesc').value,
                    images: images,
                    isPremium: document.getElementById('isPremium').checked,
                    
                    // CRITICAL: Status is PENDING until Admin approves
                    status: 'pending', 
                    
                    sellerUid: user.uid,
                    sellerEmail: user.email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    views: 0
                });

                alert("✅ Ad submitted successfully!\n\nIt is currently 'Pending Approval'. Admin will review it shortly.");
                window.location.href = "my-ads.html";

            } catch (err) {
                alert("Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Submit Ad for Approval";
            }
        });
    </script>
</body>
</html>
