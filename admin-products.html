<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Admin Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-4 pb-20">

    <!-- Header -->
    <div class="max-w-4xl mx-auto bg-white p-4 rounded-xl shadow-sm mb-6 flex justify-between items-center border border-gray-100">
        <h1 class="text-xl font-bold text-gray-800">📦 භාණ්ඩ කළමනාකරණය</h1>
        <a href="admin.html" class="text-sm text-gray-500 hover:text-blue-600 font-medium">← Dashboard</a>
    </div>

    <!-- Add Product Form -->
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-sm mb-6 border border-gray-100">
        <h2 class="text-lg font-bold mb-4 text-gray-800 border-b pb-2">නව භාණ්ඩයක් එක් කරන්න</h2>
        <form id="addProductForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">භාණ්ඩයේ නම</label>
                <input type="text" id="pName" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="iPhone 14 Pro" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">මිල (Rs.)</label>
                <input type="number" id="pPrice" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="350000" required>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Category</label>
                <select id="pCategory" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white" required>
                    <option value="">තෝරන්න...</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Home">Home & Living</option>
                    <option value="Beauty">Beauty</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Image URL</label>
                <input type="text" id="pImage" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://...">
            </div>
            
            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-gray-700 mb-1">කෙටි විස්තරය</label>
                <textarea id="pDesc" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none h-20 resize-none" placeholder="භාණ්ඩය ගැන කෙටි විස්තරයක්..."></textarea>
            </div>
            
            <button type="submit" class="bg-blue-600 text-white p-3 rounded-lg md:col-span-2 hover:bg-blue-700 transition font-bold shadow-md">💾 භාණ්ඩය Save කරන්න</button>
        </form>
    </div>

    <!-- Product List -->
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-6 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-800">ලැයිස්තුව</h2>
        </div>
        <div id="productList" class="divide-y divide-gray-100">
            <p class="p-6 text-center text-gray-400">Loading products...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Security Check: Redirect if not admin
        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "admin.html"; return; }
            const doc = await db.collection('users').doc(user.uid).get();
            if (!doc.exists || doc.data().userType !== 'admin') { 
                alert("Access Denied!"); 
                window.location.href = "index.html"; 
            }
        });

        // Add Product
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Saving...";
            btn.disabled = true;

            await db.collection('products').add({
                name: document.getElementById('pName').value,
                price: Number(document.getElementById('pPrice').value),
                category: document.getElementById('pCategory').value,
                image: document.getElementById('pImage').value || 'https://via.placeholder.com/300',
                desc: document.getElementById('pDesc').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            alert("✅ භාණ්ඩය සාර්ථකව එකතු විය!");
            e.target.reset();
            btn.innerText = originalText;
            btn.disabled = false;
        });

        // Load & Delete Products
        db.collection('products').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            const list = document.getElementById('productList');
            if(snapshot.empty) {
                list.innerHTML = '<p class="p-6 text-center text-gray-400">No products added yet.</p>';
                return;
            }
            
            list.innerHTML = snapshot.docs.map(doc => {
                const p = doc.data();
                return `
                    <div class="p-4 flex justify-between items-center hover:bg-gray-50 transition-colors group">
                        <div class="flex items-center gap-3">
                            <img src="${p.image}" onerror="this.src='https://via.placeholder.com/50'" class="w-12 h-12 rounded-lg object-cover bg-gray-200">
                            <div>
                                <h3 class="font-bold text-gray-800 text-sm">${p.name}</h3>
                                <p class="text-xs text-gray-500">${p.category} • Rs. ${p.price.toLocaleString()}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${doc.id}')" class="text-red-500 text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-red-50 opacity-0 group-hover:opacity-100 transition-opacity">
                            🗑️ Delete
                        </button>
                    </div>
                `;
            }).join('');
        });

        async function deleteProduct(id) {
            if(confirm('මෙම භාණ්ඩය මකා දැමීමට අවශ්‍යද?')) {
                await db.collection('products').doc(id).delete();
            }
        }
    </script>
</body>
</html>
