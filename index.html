<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Emarket - Sri Lanka's Best Classifieds | Buy & Sell Online</title>
    <meta name="description" content="Buy and sell cars, land, houses, mobile phones, and electronics in Sri Lanka. Free ads on Emarket. Post your ad today!">
    <meta name="keywords" content="classifieds sri lanka, buy sell lk, ikman alternative, cars for sale, land for sale, mobile phones">
    <meta name="author" content="Emarket Team">
    
    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:title" content="Emarket - Buy & Sell Anything in Sri Lanka">
    <meta property="og:description" content="Find the best deals on vehicles, property, and electronics. Post free ads now!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1556742049-0cfed4f7a07d?w=800">
    <meta property="og:url" content="https://chinthakanuwan.github.io/Emarket/">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-blue-700 flex items-center gap-2">
                <i class="fas fa-layer-group"></i> Emarket
            </a>
            
            <div class="hidden md:flex flex-1 mx-8 relative">
                <input type="text" id="searchInput" placeholder="Search ads..." class="w-full pl-4 pr-10 py-2 border rounded-l-lg focus:outline-none focus:border-blue-500">
                <button onclick="searchAds()" class="bg-blue-600 text-white px-4 rounded-r-lg hover:bg-blue-700"><i class="fas fa-search"></i></button>
            </div>

            <div class="flex items-center gap-3">
                <a href="post-ad.html" class="hidden md:block bg-orange-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-600 transition shadow-sm">
                    + Post Free Ad
                </a>
                <div id="authSection"></div>
            </div>
        </div>
    </nav>

    <!-- Main Layout -->
    <div class="container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Left Sidebar -->
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white p-4 rounded-lg shadow-sm">
                <h3 class="font-bold text-gray-800 mb-3 border-b pb-2">Categories</h3>
                <ul class="space-y-2 text-sm">
                    <li><a href="#" onclick="filterCat('All')" class="flex items-center gap-2 text-blue-600 font-medium"><i class="fas fa-th-large w-5"></i> All Ads</a></li>
                    <li><a href="#" onclick="filterCat('Vehicles')" class="flex items-center gap-2 text-gray-600 hover:text-blue-600"><i class="fas fa-car w-5"></i> Vehicles</a></li>
                    <li><a href="#" onclick="filterCat('Property')" class="flex items-center gap-2 text-gray-600 hover:text-blue-600"><i class="fas fa-home w-5"></i> Property</a></li>
                    <li><a href="#" onclick="filterCat('Mobiles')" class="flex items-center gap-2 text-gray-600 hover:text-blue-600"><i class="fas fa-mobile-alt w-5"></i> Mobile Phones</a></li>
                    <li><a href="#" onclick="filterCat('Electronics')" class="flex items-center gap-2 text-gray-600 hover:text-blue-600"><i class="fas fa-laptop w-5"></i> Electronics</a></li>
                </ul>
            </div>

            <!-- Side Ad Slot -->
            <div class="bg-gray-200 h-64 rounded-lg flex items-center justify-center text-gray-400 text-sm border-2 border-dashed border-gray-300">
                Ad Slot (300x250)
            </div>
        </aside>

        <!-- Center Content -->
        <main class="lg:col-span-2 space-y-6">
            
            <!-- Featured Ads -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i class="fas fa-star text-yellow-500"></i> Premium Ads</h2>
                </div>
                <div id="featuredAdsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- Latest Ads -->
            <div>
                <h2 class="text-lg font-bold text-gray-800 mb-3">Latest Ads</h2>
                <div id="latestAdsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="col-span-2 text-center py-10 text-gray-400">Loading ads...</div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="hidden lg:block lg:col-span-1">
            <div class="sticky top-24 space-y-6">
                <div class="bg-gray-200 h-[600px] rounded-lg flex items-center justify-center text-gray-400 text-sm border-2 border-dashed border-gray-300">
                    Vertical Ad Slot
                </div>
            </div>
        </aside>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Auth UI
        auth.onAuthStateChanged(user => {
            const section = document.getElementById('authSection');
            if (user) {
                section.innerHTML = `
                    <div class="relative group">
                        <button class="flex items-center gap-2 text-gray-700 font-medium hover:text-blue-600">
                            <img src="https://ui-avatars.com/api/?name=${user.email}&background=random" class="w-8 h-8 rounded-full">
                        </button>
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 hidden group-hover:block border z-50">
                            <a href="my-ads.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">My Ads</a>
                            <a href="admin.html" id="adminLink" class="hidden block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Admin Panel</a>
                            <button onclick="logout()" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">Logout</button>
                        </div>
                    </div>
                `;
                db.collection('users').doc(user.uid).get().then(doc => {
                    if(doc.exists && doc.data().userType === 'admin') {
                        document.getElementById('adminLink').classList.remove('hidden');
                    }
                });
            } else {
                section.innerHTML = `<a href="login.html" class="text-blue-600 font-bold hover:underline">Login</a>`;
            }
        });

        function logout() { auth.signOut().then(() => window.location.reload()); }

        // Load Ads Function
        function loadAds(isFeatured = false, containerId, category = 'All', searchTerm = '') {
            let query = db.collection('ads').where('status', '==', 'approved');
            
            if (isFeatured) query = query.where('isPremium', '==', true);
            if (category !== 'All') query = query.where('category', '==', category);
            
            query = query.orderBy('createdAt', 'desc').limit(isFeatured ? 4 : 10);

            query.onSnapshot(snap => {
                const container = document.getElementById(containerId);
                if (snap.empty) {
                    container.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-500">No ads found.</div>`;
                    return;
                }
                
                container.innerHTML = snap.docs.map(doc => {
                    const ad = doc.data();
                    // Dynamic SEO Title for each card (Good for crawlers)
                    const seoTitle = `${ad.title} - ${ad.category} in ${ad.location} | Emarket`;
                    
                    return `
                        <article class="bg-white rounded-lg shadow-sm hover:shadow-md transition border border-gray-100 overflow-hidden flex flex-col h-full cursor-pointer" 
                                 onclick="window.location.href='ad-details.html?id=${doc.id}'"
                                 itemscope itemtype="http://schema.org/Product">
                            <meta itemprop="name" content="${ad.title}">
                            <meta itemprop="description" content="${ad.desc.substring(0, 100)}...">
                            <div class="relative h-48 bg-gray-100">
                                <img src="${ad.images[0] || 'https://via.placeholder.com/400x300'}" class="w-full h-full object-cover" alt="${ad.title}" itemprop="image">
                                ${ad.isPremium ? '<span class="absolute top-2 left-2 bg-yellow-500 text-white text-[10px] font-bold px-2 py-1 rounded">PREMIUM</span>' : ''}
                                <span class="absolute bottom-2 right-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded" itemprop="category">${ad.category}</span>
                            </div>
                            <div class="p-3 flex-grow">
                                <h3 class="font-bold text-gray-800 text-sm line-clamp-2 mb-1" itemprop="name">${ad.title}</h3>
                                <p class="text-blue-700 font-extrabold text-lg" itemprop="offers" itemscope itemtype="http://schema.org/Offer">
                                    <span itemprop="priceCurrency" content="LKR">Rs.</span> 
                                    <span itemprop="price">${Number(ad.price).toLocaleString()}</span>
                                </p>
                                <p class="text-xs text-gray-500 mt-1 truncate" itemprop="address" itemscope itemtype="http://schema.org/PostalAddress">
                                    <i class="fas fa-map-marker-alt mr-1"></i><span itemprop="addressLocality">${ad.location || 'Sri Lanka'}</span>
                                </p>
                            </div>
                            <div class="px-3 pb-3 pt-0 flex justify-between items-center text-xs text-gray-400">
                                <time datetime="${new Date(ad.createdAt?.seconds * 1000).toISOString()}">${new Date(ad.createdAt?.seconds * 1000).toLocaleDateString()}</time>
                                <span class="text-blue-500 font-medium">View Details ></span>
                            </div>
                        </article>
                    `;
                }).join('');
            });
        }

        // Initial Load
        loadAds(true, 'featuredAdsGrid');
        loadAds(false, 'latestAdsGrid');

        function filterCat(cat) { loadAds(false, 'latestAdsGrid', cat); }
        
        function searchAds() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            // Simple client-side filtering for demo (In production use Algolia or Firestore Composite Index)
            loadAds(false, 'latestAdsGrid', 'All'); 
            // Note: Real search requires backend indexing. For now, we just reload all.
        }
    </script>
</body>
</html>
