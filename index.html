<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-sm p-4">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold text-blue-600">Emarket</h1>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-6">
        <!-- Status Message -->
        <div id="statusMessage" class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
            <p class="text-blue-800">Initializing...</p>
        </div>

        <!-- Premium Ads -->
        <div class="mb-6">
            <h2 class="text-xl font-bold mb-3">Premium Ads</h2>
            <div id="premiumAds" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-gray-400">Loading...</p>
            </div>
        </div>

        <!-- Latest Ads -->
        <div>
            <h2 class="text-xl font-bold mb-3">Latest Ads</h2>
            <div id="latestAds" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <p class="text-gray-400">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const statusDiv = document.getElementById('statusMessage');
        
        function updateStatus(message, type = 'info') {
            const colors = {
                info: 'bg-blue-50 border-blue-200 text-blue-800',
                success: 'bg-green-50 border-green-200 text-green-800',
                error: 'bg-red-50 border-red-200 text-red-800'
            };
            statusDiv.className = `${colors[type]} border rounded-lg p-4 mb-6`;
            statusDiv.innerHTML = `<p>${message}</p>`;
        }

        // Test Firestore Connection
        async function testFirestore() {
            try {
                updateStatus("🔄 Testing Firestore connection...");
                console.log("Testing Firestore...");
                
                const testSnapshot = await db.collection('ads').limit(1).get();
                console.log("✅ Firestore works! Found", testSnapshot.size, "docs");
                
                updateStatus("✅ Firestore connected successfully!", "success");
                loadAllAds();
                
            } catch (error) {
                console.error("❌ Firestore error:", error);
                let errorMsg = error.message;
                
                if (error.code === 'permission-denied') {
                    errorMsg = "❌ Permission Denied! Check Firestore Rules. Go to Firebase Console > Firestore Database > Rules and set: allow read, write: if true;";
                } else if (error.code === 'failed-precondition') {
                    errorMsg = "❌ Index Required! Check console for index creation link.";
                }
                
                updateStatus(errorMsg, "error");
                document.getElementById('premiumAds').innerHTML = `<p class="text-red-500">${errorMsg}</p>`;
                document.getElementById('latestAds').innerHTML = `<p class="text-red-500">${errorMsg}</p>`;
            }
        }

        // Load All Ads
        async function loadAllAds() {
            try {
                updateStatus("🔄 Loading approved ads from database...");
                
                const snapshot = await db.collection('ads')
                    .where('status', '==', 'approved')
                    .orderBy('createdAt', 'desc')
                    .get();
                
                console.log("✅ Found", snapshot.size, "approved ads");
                
                if (snapshot.empty) {
                    updateStatus("⚠️ No approved ads found in database. Admin needs to approve ads first.", "error");
                    document.getElementById('premiumAds').innerHTML = 
                        '<p class="text-gray-400">No premium ads. Admin needs to approve ads first.</p>';
                    document.getElementById('latestAds').innerHTML = 
                        '<p class="text-gray-400">No ads available. Please check back later.</p>';
                    return;
                }
                
                updateStatus(`✅ Successfully loaded ${snapshot.size} ads!`, "success");
                
                const allAds = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                console.log("Ads data:", allAds);
                
                // Premium Ads
                const premiumAds = allAds.filter(ad => ad.isPremium === true).slice(0, 4);
                renderAds('premiumAds', premiumAds);
                
                // Latest Ads
                const latestAds = allAds.slice(0, 6);
                renderAds('latestAds', latestAds);
                
            } catch (error) {
                console.error("❌ Error loading ads:", error);
                updateStatus("❌ Error: " + error.message, "error");
            }
        }

        // Render Ads
        function renderAds(containerId, ads) {
            const container = document.getElementById(containerId);
            
            if (ads.length === 0) {
                container.innerHTML = '<p class="text-gray-400">No ads found</p>';
                return;
            }
            
            container.innerHTML = ads.map(ad => {
                const img = ad.images && ad.images[0] ? ad.images[0] : 'https://via.placeholder.com/300x200?text=No+Image';
                const price = ad.price ? `Rs. ${Number(ad.price).toLocaleString()}` : 'Contact for price';
                const title = ad.title || 'Untitled Ad';
                const location = ad.location || 'Sri Lanka';
                
                return `
                    <div class="bg-white rounded-lg shadow p-4 border">
                        <img src="${img}" onerror="this.src='https://via.placeholder.com/300x200?text=Error'" 
                             class="w-full h-40 object-cover rounded mb-3">
                        <h3 class="font-bold text-gray-800">${title}</h3>
                        <p class="text-blue-600 font-bold mt-1">${price}</p>
                        <p class="text-sm text-gray-500"><i class="fas fa-map-marker-alt"></i> ${location}</p>
                        ${ad.isPremium ? '<span class="inline-block mt-2 bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded">PREMIUM</span>' : ''}
                    </div>
                `;
            }).join('');
        }

        // Run on page load
        console.log("Page loaded, testing Firestore...");
        testFirestore();
    </script>
</body>
</html>
