<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Login</title>
    <!-- ලස්සන Design එකට Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Compat Libraries (Node.js අවශ්‍ය නෑ, කෙලින්ම වැඩ කරනවා) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">Emarket</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">යාගේ ගිණුමට පිවිසෙන්න</p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="example@email.com" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">මුරපදය (Password)</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-semibold">ලොග් වන්න</button>
        </form>

        <p id="message" class="text-center mt-4 text-sm font-medium"></p>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">ගිණුමක් නැද්ද? <a href="#" class="text-blue-600 hover:underline">ලියාපදිංචි වන්න</a></p>
        </div>
    </div>

    <script>
        // ==========================================
        // ඔයාගේ FIREBASE CONFIG CODE එක මෙතනට දාන්න
        // (API Key එක මෙතනට paste කරන්න, chat එකට දාන්න එපා!)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4", 
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b",
            measurementId: "G-LYM94LMHXC"
        };

        // Firebase Initialize කිරීම
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Login Button එක click කළාම වැඩ කරන Function එක
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Page එක reload වෙන්න නවත්වනවා
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');
            const btn = document.getElementById('loginBtn');

            // Loading පෙන්නන්න
            btn.innerText = "පරීක්ෂා කරමින්...";
            btn.disabled = true;
            messageEl.innerText = "";

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // සාර්ථකව ලොග් වුනාම
                    messageEl.style.color = "green";
                    messageEl.innerText = "සාර්ථකව ලොග් වුනා! සාදරයෙන් පිළිගනිමු.";
                    console.log("User logged in:", userCredential.user.email);
                    
                    // මෙතනින් පස්සේ ඔයාට Dashboard page එකට redirect කරන්න පුළුවන්
                    // window.location.href = "dashboard.html"; 
                })
                .catch((error) => {
                    // දෝෂයක් ආවොත් (උදා: වැරදි password එකක්)
                    messageEl.style.color = "red";
                    
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        messageEl.innerText = "වැරදි Email හෝ මුරපදයකි.";
                    } else {
                        messageEl.innerText = "දෝෂයක්: " + error.message;
                    }
                    console.error("Login Error:", error);
                })
                .finally(() => {
                    // Loading ඉවර කරන්න
                    btn.innerText = "ලොග් වන්න";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
