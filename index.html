<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - Emarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-6">
            <a href="index.html" class="text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fas fa-layer-group"></i> Emarket
            </a>
            <p class="text-gray-500 mt-2">Login or create account</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex gap-2 mb-6">
            <button onclick="showTab('email')" id="emailTab" class="flex-1 py-2 rounded-lg font-bold bg-blue-600 text-white">
                <i class="fas fa-envelope mr-2"></i>Email
            </button>
            <button onclick="showTab('phone')" id="phoneTab" class="flex-1 py-2 rounded-lg font-bold bg-gray-200 text-gray-700">
                <i class="fas fa-mobile-alt mr-2"></i>Phone
            </button>
        </div>

        <!-- Email Login/Signup Form -->
        <div id="emailForm" class="space-y-4">
            <!-- Toggle between Login and Signup -->
            <div class="flex gap-2 mb-4">
                <button onclick="showEmailMode('login')" id="emailLoginBtn" class="flex-1 py-2 rounded-lg font-bold bg-blue-100 text-blue-600">
                    Login
                </button>
                <button onclick="showEmailMode('signup')" id="emailSignupBtn" class="flex-1 py-2 rounded-lg font-bold bg-gray-100 text-gray-600">
                    Sign Up
                </button>
            </div>

            <div id="signupNameField" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="John Doe">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="your@email.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
            </div>

            <div id="signupConfirmPassword" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
            </div>

            <button onclick="handleEmailAuth()" id="emailSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold">
                <i class="fas fa-sign-in-alt mr-2"></i>Login
            </button>
        </div>

        <!-- Phone OTP Form -->
        <div id="phoneForm" class="hidden space-y-4">
            <!-- Step 1: Enter Phone Number -->
            <div id="phoneStep1">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
                    <p class="text-sm text-blue-800">
                        <i class="fas fa-info-circle mr-1"></i>
                        Enter your mobile number to receive OTP
                    </p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                    <div class="flex gap-2">
                        <span class="px-4 py-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-600">+94</span>
                        <input type="tel" id="phoneNumber" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="771234567">
                    </div>
                    <p class="text-xs text-gray-500 mt-1">Example: 771234567</p>
                </div>

                <button onclick="sendOTP()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold mt-4">
                    <i class="fas fa-paper-plane mr-2"></i>Send OTP
                </button>
            </div>

            <!-- Step 2: Enter OTP -->
            <div id="phoneStep2" class="hidden">
                <div class="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
                    <p class="text-sm text-green-800">
                        <i class="fas fa-check-circle mr-1"></i>
                        OTP sent to <span id="sentPhoneNumber" class="font-bold"></span>
                    </p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Enter OTP Code</label>
                    <input type="text" id="otpCode" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-center text-2xl tracking-widest" placeholder="••••••" maxlength="6">
                    <p class="text-xs text-gray-500 mt-1">6-digit code from SMS</p>
                </div>

                <div id="newUserFields" class="hidden space-y-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="phoneFullName" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Your name">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email (Optional)</label>
                        <input type="email" id="phoneEmail" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="your@email.com">
                    </div>
                </div>

                <button onclick="verifyOTP()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold mt-4">
                    <i class="fas fa-check mr-2"></i>Verify OTP
                </button>

                <button onclick="resetPhoneAuth()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-lg font-bold mt-2">
                    <i class="fas fa-arrow-left mr-2"></i>Change Number
                </button>
            </div>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg"></div>

        <!-- Divider -->
        <div class="my-6 flex items-center">
            <div class="flex-1 border-t"></div>
            <span class="px-4 text-gray-400 text-sm">OR</span>
            <div class="flex-1 border-t"></div>
        </div>

        <!-- Back to Home -->
        <a href="index.html" class="block text-center text-gray-600 hover:text-blue-600 font-medium">
            <i class="fas fa-arrow-left mr-2"></i>Back to Home
        </a>
    </div>

    <!-- reCAPTCHA Container (Required for Phone Auth) -->
    <div id="recaptcha-container"></div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let emailMode = 'login';
        let confirmationResult = null;

        // Check if already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        // Tab Switching
        function showTab(tab) {
            if (tab === 'email') {
                document.getElementById('emailForm').classList.remove('hidden');
                document.getElementById('phoneForm').classList.add('hidden');
                document.getElementById('emailTab').classList.add('bg-blue-600', 'text-white');
                document.getElementById('emailTab').classList.remove('bg-gray-200', 'text-gray-700');
                document.getElementById('phoneTab').classList.add('bg-gray-200', 'text-gray-700');
                document.getElementById('phoneTab').classList.remove('bg-blue-600', 'text-white');
            } else {
                document.getElementById('emailForm').classList.add('hidden');
                document.getElementById('phoneForm').classList.remove('hidden');
                document.getElementById('phoneTab').classList.add('bg-blue-600', 'text-white');
                document.getElementById('phoneTab').classList.remove('bg-gray-200', 'text-gray-700');
                document.getElementById('emailTab').classList.add('bg-gray-200', 'text-gray-700');
                document.getElementById('emailTab').classList.remove('bg-blue-600', 'text-white');
                
                // Initialize reCAPTCHA
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                        'size': 'invisible',
                        'callback': (response) => {
                            console.log("reCAPTCHA solved");
                        }
                    });
                }
            }
        }

        // Email Mode Switching
        function showEmailMode(mode) {
            emailMode = mode;
            if (mode === 'login') {
                document.getElementById('emailLoginBtn').classList.add('bg-blue-100', 'text-blue-600');
                document.getElementById('emailLoginBtn').classList.remove('bg-gray-100', 'text-gray-600');
                document.getElementById('emailSignupBtn').classList.add('bg-gray-100', 'text-gray-600');
                document.getElementById('emailSignupBtn').classList.remove('bg-blue-100', 'text-blue-600');
                document.getElementById('signupNameField').classList.add('hidden');
                document.getElementById('signupConfirmPassword').classList.add('hidden');
                document.getElementById('emailSubmitBtn').innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
            } else {
                document.getElementById('emailSignupBtn').classList.add('bg-blue-100', 'text-blue-600');
                document.getElementById('emailSignupBtn').classList.remove('bg-gray-100', 'text-gray-600');
                document.getElementById('emailLoginBtn').classList.add('bg-gray-100', 'text-gray-600');
                document.getElementById('emailLoginBtn').classList.remove('bg-blue-100', 'text-blue-600');
                document.getElementById('signupNameField').classList.remove('hidden');
                document.getElementById('signupConfirmPassword').classList.remove('hidden');
                document.getElementById('emailSubmitBtn').innerHTML = '<i class="fas fa-user-plus mr-2"></i>Sign Up';
            }
        }

        // Email Auth (Login/Signup)
        async function handleEmailAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showStatus('Please fill all fields', 'error');
                return;
            }

            try {
                if (emailMode === 'login') {
                    // Login
                    await auth.signInWithEmailAndPassword(email, password);
                    showStatus('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    // Signup
                    const fullName = document.getElementById('fullName').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    
                    if (!fullName) {
                        showStatus('Please enter your name', 'error');
                        return;
                    }
                    
                    if (password !== confirmPassword) {
                        showStatus('Passwords do not match', 'error');
                        return;
                    }
                    
                    if (password.length < 6) {
                        showStatus('Password must be at least 6 characters', 'error');
                        return;
                    }

                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    
                    // Save user data to Firestore
                    await db.collection('users').doc(userCredential.user.uid).set({
                        fullName: fullName,
                        email: email,
                        userType: 'customer',
                        status: 'active',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    showStatus('✅ Account created successfully!', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                }
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
            }
        }

        // Phone OTP - Send OTP
        async function sendOTP() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            
            if (!phoneNumber || phoneNumber.length < 9) {
                showStatus('Please enter valid phone number', 'error');
                return;
            }

            const fullNumber = '+94' + phoneNumber;
            
            try {
                showStatus('📤 Sending OTP...', 'info');
                
                confirmationResult = await auth.signInWithPhoneNumber(fullNumber, window.recaptchaVerifier);
                
                document.getElementById('sentPhoneNumber').textContent = fullNumber;
                document.getElementById('phoneStep1').classList.add('hidden');
                document.getElementById('phoneStep2').classList.remove('hidden');
                
                showStatus('✅ OTP sent! Check your SMS', 'success');
                
                // Check if user exists
                const userSnapshot = await db.collection('users').where('phone', '==', fullNumber).get();
                
                if (userSnapshot.empty) {
                    // New user - show name/email fields
                    document.getElementById('newUserFields').classList.remove('hidden');
                } else {
                    // Existing user
                    document.getElementById('newUserFields').classList.add('hidden');
                }
                
            } catch (error) {
                showStatus('❌ ' + error.message, 'error');
                console.error(error);
            }
        }

        // Phone OTP - Verify
        async function verifyOTP() {
            const otpCode = document.getElementById('otpCode').value;
            
            if (!otpCode || otpCode.length !== 6) {
                showStatus('Please enter 6-digit OTP', 'error');
                return;
            }

            try {
                showStatus('🔄 Verifying OTP...', 'info');
                
                const result = await confirmationResult.confirm(otpCode);
                const user = result.user;
                
                // Check if user exists in Firestore
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    // New user - save data
                    const fullName = document.getElementById('phoneFullName').value;
                    const email = document.getElementById('phoneEmail').value;
                    
                    if (!fullName) {
                        showStatus('Please enter your name', 'error');
                        return;
                    }

                    await db.collection('users').doc(user.uid).set({
                        fullName: fullName,
                        email: email || '',
                        phone: '+94' + document.getElementById('phoneNumber').value,
                        userType: 'customer',
                        status: 'active',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                showStatus('✅ Verification successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
                
            } catch (error) {
                showStatus('❌ Invalid OTP. Please try again.', 'error');
                console.error(error);
            }
        }

        // Reset Phone Auth
        function resetPhoneAuth() {
            document.getElementById('phoneStep1').classList.remove('hidden');
            document.getElementById('phoneStep2').classList.add('hidden');
            document.getElementById('otpCode').value = '';
            document.getElementById('phoneNumber').value = '';
        }

        // Show Status Message
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.classList.remove('hidden');
            statusDiv.textContent = message;
            
            const colors = {
                success: 'bg-green-50 border border-green-200 text-green-800',
                error: 'bg-red-50 border border-red-200 text-red-800',
                info: 'bg-blue-50 border border-blue-200 text-blue-800'
            };
            
            statusDiv.className = `${colors[type]} p-3 rounded-lg mt-4`;
            
            setTimeout(() => {
                statusDiv.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
