<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Sri Lanka's Best Classifieds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b">
        <div class="container mx-auto px-4 py-3">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <a href="index.html" class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                    <i class="fas fa-layer-group"></i> Emarket
                </a>
                
                <div class="flex-1 max-w-2xl">
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" placeholder="Search ads..." 
                               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                        <button onclick="searchAds()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <a href="post-ad.html" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-600">
                        <i class="fas fa-plus mr-2"></i>Post Free Ad
                    </a>
                    <div id="authSection">
                        <a href="login.html" class="text-blue-600 font-bold hover:underline">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Sidebar - Categories -->
            <aside class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-sm p-4 sticky top-20">
                    <h3 class="font-bold text-gray-800 mb-3 border-b pb-2 text-sm">Categories</h3>
                    <ul class="space-y-1 text-xs" id="categoryList">
                        <!-- Main Categories -->
                        <li><button onclick="filterCategory('All')" class="w-full text-left flex items-center gap-2 text-blue-600 font-medium hover:bg-blue-50 px-2 py-1.5 rounded">
                            <i class="fas fa-th-large w-4"></i> All Ads
                        </button></li>
                        <li><button onclick="filterCategory('Vehicles')" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1.5 rounded">
                            <i class="fas fa-car w-4"></i> Vehicles
                        </button></li>
                        <li><button onclick="filterCategory('Property')" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1.5 rounded">
                            <i class="fas fa-home w-4"></i> Property
                        </button></li>
                        <li><button onclick="filterCategory('Mobiles')" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1.5 rounded">
                            <i class="fas fa-mobile-alt w-4"></i> Mobile Phones
                        </button></li>
                        <li><button onclick="filterCategory('Electronics')" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1.5 rounded">
                            <i class="fas fa-laptop w-4"></i> Electronics
                        </button></li>
                        <li><button onclick="filterCategory('Fashion')" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1.5 rounded">
                            <i class="fas fa-tshirt w-4"></i> Fashion
                        </button></li>
                        <li><button onclick="filterCategory('Jobs')" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1.5 rounded">
                            <i class="fas fa-briefcase w-4"></i> Jobs
                        </button></li>
                        
                        <!-- More Categories Button -->
                        <li class="pt-2 mt-2 border-t">
                            <button onclick="showMoreCategories()" class="w-full text-left flex items-center gap-2 text-blue-600 hover:bg-blue-50 px-2 py-1.5 rounded text-xs font-medium">
                                <i class="fas fa-ellipsis-h"></i> More Categories
                            </button>
                        </li>
                    </ul>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="lg:col-span-10 space-y-6">
                
                <!-- Premium Ads Section (Section 1 & 2) -->
                <div>
                    <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-star text-yellow-500"></i> Premium Ads
                    </h2>
                    <div id="premiumAdsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-2 text-center py-10 text-gray-400">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>Loading premium ads...</p>
                        </div>
                    </div>
                </div>

                <!-- Latest Ads Section (Section 3, 4, 5) -->
                <div>
                    <h2 class="text-lg font-bold text-gray-800 mb-3">Latest Ads</h2>
                    <div id="latestAdsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="col-span-full text-center py-10 text-gray-400">
                            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                            <p>Loading ads...</p>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- More Categories Modal -->
    <div id="moreCategoriesModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">All Categories</h3>
                <button onclick="closeMoreCategories()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="filterCategory('Hotels')" class="text-left p-3 hover:bg-gray-50 rounded-lg border">
                    <i class="fas fa-hotel mr-2"></i> Hotels
                </button>
                <button onclick="filterCategory('Restaurants')" class="text-left p-3 hover:bg-gray-50 rounded-lg border">
                    <i class="fas fa-utensils mr-2"></i> Restaurants
                </button>
                <button onclick="filterCategory('Services')" class="text-left p-3 hover:bg-gray-50 rounded-lg border">
                    <i class="fas fa-tools mr-2"></i> Services
                </button>
                <button onclick="filterCategory('Pets')" class="text-left p-3 hover:bg-gray-50 rounded-lg border">
                    <i class="fas fa-paw mr-2"></i> Pets
                </button>
                <button onclick="filterCategory('Sports')" class="text-left p-3 hover:bg-gray-50 rounded-lg border">
                    <i class="fas fa-football-ball mr-2"></i> Sports
                </button>
                <button onclick="filterCategory('Books')" class="text-left p-3 hover:bg-gray-50 rounded-lg border">
                    <i class="fas fa-book mr-2"></i> Books
                </button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let currentCategory = 'All';

        // Auth State
        auth.onAuthStateChanged(user => {
            const authSection = document.getElementById('authSection');
            if (user) {
                authSection.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-sm">
                            ${user.email.charAt(0).toUpperCase()}
                        </div>
                        <span class="hidden md:inline text-sm font-medium">${user.email.split('@')[0]}</span>
                    </div>
                `;
            }
        });

        // Load Ads
        function loadAds() {
            console.log("🔄 Loading ads for category:", currentCategory);
            
            let query = db.collection('ads')
                .where('status', '==', 'approved')
                .orderBy('createdAt', 'desc');
            
            if (currentCategory !== 'All') {
                query = query.where('category', '==', currentCategory);
            }
            
            query.get()
                .then(snapshot => {
                    console.log("✅ Found", snapshot.size, "ads");
                    
                    if (snapshot.empty) {
                        document.getElementById('premiumAdsGrid').innerHTML = 
                            '<div class="col-span-2 text-center py-10 text-gray-400">No premium ads</div>';
                        document.getElementById('latestAdsGrid').innerHTML = 
                            '<div class="col-span-full text-center py-10 text-gray-400">No ads found</div>';
                        return;
                    }
                    
                    const allAds = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    // Filter Premium
                    const premiumAds = allAds.filter(ad => ad.isPremium === true).slice(0, 4);
                    
                    // Latest Ads (non-premium or all)
                    const latestAds = allAds.filter(ad => !ad.isPremium).slice(0, 6);
                    
                    console.log(" Premium:", premiumAds.length, "Latest:", latestAds.length);
                    
                    // Render
                    renderAds('premiumAdsGrid', premiumAds, true);
                    renderAds('latestAdsGrid', latestAds, false);
                })
                .catch(error => {
                    console.error("❌ Error:", error);
                    document.getElementById('latestAdsGrid').innerHTML = `
                        <div class="col-span-full text-center py-10">
                            <p class="text-red-500 font-bold mb-2">Error loading ads</p>
                            <p class="text-sm text-gray-600">${error.message}</p>
                        </div>
                    `;
                });
        }

        // Render Ads
        function renderAds(containerId, ads, isPremium) {
            const container = document.getElementById(containerId);
            
            if (ads.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">No ads found</div>';
                return;
            }
            
            const gridClass = isPremium ? 'grid grid-cols-1 md:grid-cols-2 gap-4' : 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
            
            container.className = gridClass;
            
            container.innerHTML = ads.map(ad => {
                const imageUrl = ad.images && ad.images.length > 0 ? ad.images[0] : 'https://via.placeholder.com/400x300?text=No+Image';
                const price = ad.price ? `Rs. ${Number(ad.price).toLocaleString()}` : 'Contact for price';
                const location = ad.location || 'Sri Lanka';
                const date = ad.createdAt ? new Date(ad.createdAt.seconds * 1000).toLocaleDateString() : 'Recently';
                
                return `
                    <article class="bg-white rounded-lg shadow-sm hover:shadow-md transition border border-gray-100 overflow-hidden cursor-pointer group" 
                             onclick="window.location.href='ad-details.html?id=${ad.id}'">
                        <div class="relative h-48 bg-gray-100 overflow-hidden">
                            <img src="${imageUrl}" 
                                 onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'"
                                 alt="${ad.title}" 
                                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            ${ad.isPremium ? '<span class="absolute top-2 left-2 bg-yellow-500 text-white text-[10px] font-bold px-2 py-1 rounded">PREMIUM</span>' : ''}
                            <span class="absolute bottom-2 right-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded">${ad.category || 'General'}</span>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2 mb-1">${ad.title || 'Untitled'}</h3>
                            <p class="text-blue-700 font-extrabold text-lg">${price}</p>
                            <p class="text-xs text-gray-500 mt-1 truncate">
                                <i class="fas fa-map-marker-alt mr-1"></i>${location}
                            </p>
                            <p class="text-xs text-gray-400 mt-2">${date}</p>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Filter Category
        function filterCategory(category) {
            currentCategory = category;
            
            // Update UI
            document.querySelectorAll('#categoryList button').forEach(btn => {
                btn.classList.remove('text-blue-600', 'font-medium', 'bg-blue-50');
                btn.classList.add('text-gray-600');
            });
            
            event.target.closest('button').classList.remove('text-gray-600');
            event.target.closest('button').classList.add('text-blue-600', 'font-medium', 'bg-blue-50');
            
            loadAds();
        }

        // Show More Categories Modal
        function showMoreCategories() {
            document.getElementById('moreCategoriesModal').classList.remove('hidden');
        }

        function closeMoreCategories() {
            document.getElementById('moreCategoriesModal').classList.add('hidden');
        }

        // Search
        function searchAds() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            if (!term) {
                loadAds();
                return;
            }
            
            db.collection('ads')
                .where('status', '==', 'approved')
                .get()
                .then(snapshot => {
                    const filtered = snapshot.docs
                        .map(doc => ({id: doc.id, ...doc.data()}))
                        .filter(ad => 
                            (ad.title && ad.title.toLowerCase().includes(term)) ||
                            (ad.desc && ad.desc.toLowerCase().includes(term))
                        );
                    
                    renderAds('latestAdsGrid', filtered, false);
                });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 Emarket initialized");
            filterCategory('All');
            loadAds();
        });

        // Close modal on outside click
        document.getElementById('moreCategoriesModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeMoreCategories();
            }
        });
    </script>
</body>
</html>
