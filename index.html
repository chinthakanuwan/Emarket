<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Sri Lanka's Best Classifieds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b">
        <div class="container mx-auto px-4 py-3">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <a href="index.html" class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                    <i class="fas fa-layer-group"></i> Emarket
                </a>
                
                <div class="flex-1 max-w-2xl">
                    <div class="flex gap-2">
                        <input type="text" id="searchInput" placeholder="Search ads..." 
                               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500">
                        <button onclick="searchAds()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <a href="post-ad.html" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-600">
                        <i class="fas fa-plus mr-2"></i>Post Free Ad
                    </a>
                    <div id="authSection">
                        <a href="login.html" class="text-blue-600 font-bold hover:underline">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Left Sidebar -->
            <aside class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-sm p-4 sticky top-20">
                    <h3 class="font-bold text-gray-800 mb-3 border-b pb-2">Categories</h3>
                    <ul class="space-y-2 text-sm">
                        <li><button onclick="filterCategory('All')" id="cat-All" class="w-full text-left flex items-center gap-2 text-blue-600 font-medium hover:bg-blue-50 px-2 py-1 rounded">
                            <i class="fas fa-th-large w-5"></i> All Ads
                        </button></li>
                        <li><button onclick="filterCategory('Vehicles')" id="cat-Vehicles" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1 rounded">
                            <i class="fas fa-car w-5"></i> Vehicles
                        </button></li>
                        <li><button onclick="filterCategory('Property')" id="cat-Property" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1 rounded">
                            <i class="fas fa-home w-5"></i> Property
                        </button></li>
                        <li><button onclick="filterCategory('Mobiles')" id="cat-Mobiles" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1 rounded">
                            <i class="fas fa-mobile-alt w-5"></i> Mobile Phones
                        </button></li>
                        <li><button onclick="filterCategory('Electronics')" id="cat-Electronics" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1 rounded">
                            <i class="fas fa-laptop w-5"></i> Electronics
                        </button></li>
                        <li><button onclick="filterCategory('Hotels')" id="cat-Hotels" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1 rounded">
                            <i class="fas fa-hotel w-5"></i> Hotels
                        </button></li>
                        <li><button onclick="filterCategory('Restaurants')" id="cat-Restaurants" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1 rounded">
                            <i class="fas fa-utensils w-5"></i> Restaurants
                        </button></li>
                        <li><button onclick="filterCategory('Jobs')" id="cat-Jobs" class="w-full text-left flex items-center gap-2 text-gray-600 hover:bg-gray-50 px-2 py-1 rounded">
                            <i class="fas fa-briefcase w-5"></i> Jobs
                        </button></li>
                    </ul>
                    <div class="mt-6 bg-gray-200 h-64 rounded-lg flex items-center justify-center text-gray-400 text-xs border-2 border-dashed border-gray-300">
                        Ad Slot (300x250)
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="lg:col-span-2 space-y-6">
                <!-- Premium Ads -->
                <div>
                    <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
                        <i class="fas fa-star text-yellow-500"></i> Premium Ads
                    </h2>
                    <div id="premiumAdsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="col-span-2 text-center py-10 text-gray-400">Loading...</div>
                    </div>
                </div>

                <!-- Ad Slot -->
                <div class="bg-gray-200 h-24 rounded-lg flex items-center justify-center text-gray-400 text-xs border-2 border-dashed border-gray-300">
                    Ad Slot (728x90)
                </div>

                <!-- Latest Ads -->
                <div>
                    <h2 class="text-lg font-bold text-gray-800 mb-3">Latest Ads</h2>
                    <div id="latestAdsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="col-span-2 text-center py-10 text-gray-400">Loading...</div>
                    </div>
                </div>
            </main>

            <!-- Right Sidebar -->
            <aside class="hidden lg:block lg:col-span-1">
                <div class="sticky top-20">
                    <div class="bg-gray-200 h-[600px] rounded-lg flex items-center justify-center text-gray-400 text-xs border-2 border-dashed border-gray-300">
                        Ad Slot (160x600)
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDwEBngqfjL7COptg3abQCJA4X0wxz0MN4",
            authDomain: "emarket-e3421.firebaseapp.com",
            projectId: "emarket-e3421",
            storageBucket: "emarket-e3421.firebasestorage.app",
            messagingSenderId: "1029527442178",
            appId: "1:1029527442178:web:535443f333ce6e9deda81b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let currentCategory = 'All';

        // Auth State
        auth.onAuthStateChanged(user => {
            const authSection = document.getElementById('authSection');
            if (user) {
                authSection.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-sm">
                            ${user.email.charAt(0).toUpperCase()}
                        </div>
                        <span class="hidden md:inline text-sm font-medium">${user.email.split('@')[0]}</span>
                    </div>
                `;
            }
        });

        // Load Ads - Using simple query
        function loadAds() {
            console.log("🔄 Loading ads...");
            
            // First, let's test if we can access Firestore
            db.collection('ads').limit(1).get()
                .then(testSnapshot => {
                    console.log("✅ Firestore connection successful!");
                    
                    // Now load approved ads
                    return db.collection('ads')
                        .where('status', '==', 'approved')
                        .orderBy('createdAt', 'desc')
                        .get();
                })
                .then(snapshot => {
                    console.log("✅ Found", snapshot.size, "approved ads");
                    
                    if (snapshot.empty) {
                        document.getElementById('premiumAdsGrid').innerHTML = 
                            '<div class="col-span-2 text-center py-10 text-gray-400">No ads yet</div>';
                        document.getElementById('latestAdsGrid').innerHTML = 
                            '<div class="col-span-2 text-center py-10 text-gray-400">No ads available</div>';
                        return;
                    }
                    
                    const allAds = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    
                    console.log("📊 Ads loaded:", allAds);
                    
                    // Filter Premium
                    const premiumAds = allAds.filter(ad => ad.isPremium === true).slice(0, 4);
                    
                    // Filter by Category
                    let latestAds = currentCategory === 'All' 
                        ? allAds.slice(0, 10)
                        : allAds.filter(ad => ad.category === currentCategory).slice(0, 10);
                    
                    // Render
                    renderAds('premiumAdsGrid', premiumAds);
                    renderAds('latestAdsGrid', latestAds);
                })
                .catch(error => {
                    console.error("❌ Error:", error);
                    document.getElementById('latestAdsGrid').innerHTML = `
                        <div class="col-span-2 text-center py-10">
                            <p class="text-red-500 font-bold mb-2">Error loading ads</p>
                            <p class="text-sm text-gray-600">${error.message}</p>
                            <p class="text-xs text-gray-500 mt-2">Check console for details</p>
                        </div>
                    `;
                });
        }

        // Render Ads
        function renderAds(containerId, ads) {
            const container = document.getElementById(containerId);
            
            if (ads.length === 0) {
                container.innerHTML = '<div class="col-span-2 text-center py-10 text-gray-400">No ads found</div>';
                return;
            }
            
            container.innerHTML = ads.map(ad => {
                const imageUrl = ad.images && ad.images.length > 0 ? ad.images[0] : 'https://via.placeholder.com/400x300?text=No+Image';
                const price = ad.price ? `Rs. ${Number(ad.price).toLocaleString()}` : 'Contact for price';
                const location = ad.location || 'Sri Lanka';
                const date = ad.createdAt ? new Date(ad.createdAt.seconds * 1000).toLocaleDateString() : 'Recently';
                
                return `
                    <article class="bg-white rounded-lg shadow-sm hover:shadow-md transition border border-gray-100 overflow-hidden cursor-pointer" 
                             onclick="window.location.href='ad-details.html?id=${ad.id}'">
                        <div class="relative h-48 bg-gray-100">
                            <img src="${imageUrl}" 
                                 onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'"
                                 alt="${ad.title}" 
                                 class="w-full h-full object-cover">
                            ${ad.isPremium ? '<span class="absolute top-2 left-2 bg-yellow-500 text-white text-[10px] font-bold px-2 py-1 rounded">PREMIUM</span>' : ''}
                            <span class="absolute bottom-2 right-2 bg-black/70 text-white text-[10px] px-2 py-1 rounded">${ad.category || 'General'}</span>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2 mb-1">${ad.title || 'Untitled'}</h3>
                            <p class="text-blue-700 font-extrabold text-lg">${price}</p>
                            <p class="text-xs text-gray-500 mt-1 truncate">
                                <i class="fas fa-map-marker-alt mr-1"></i>${location}
                            </p>
                            <p class="text-xs text-gray-400 mt-2">${date}</p>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Filter Category
        function filterCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('[id^="cat-"]').forEach(btn => {
                btn.classList.remove('text-blue-600', 'font-medium', 'bg-blue-50');
                btn.classList.add('text-gray-600');
            });
            
            const activeBtn = document.getElementById(`cat-${category}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-600');
                activeBtn.classList.add('text-blue-600', 'font-medium', 'bg-blue-50');
            }
            
            loadAds();
        }

        // Search
        function searchAds() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            if (!term) {
                loadAds();
                return;
            }
            
            db.collection('ads')
                .where('status', '==', 'approved')
                .get()
                .then(snapshot => {
                    const filtered = snapshot.docs
                        .map(doc => ({id: doc.id, ...doc.data()}))
                        .filter(ad => 
                            (ad.title && ad.title.toLowerCase().includes(term)) ||
                            (ad.desc && ad.desc.toLowerCase().includes(term))
                        );
                    
                    renderAds('latestAdsGrid', filtered);
                });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 Emarket initialized");
            filterCategory('All');
            loadAds();
        });
    </script>
</body>
</html>
