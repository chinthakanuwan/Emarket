<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emarket - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">Emarket 🛒</h1>
            <div class="space-x-3 text-sm font-medium">
                <a href="shop.html" class="hover:text-blue-200 transition">Shop</a>
                <a href="login.html" class="bg-white text-blue-600 px-4 py-1.5 rounded-full hover:bg-blue-50 transition shadow-sm">Login / Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex items-center justify-center p-6 text-center">
        <div class="max-w-xl">
            <span class="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-700 text-xs font-bold mb-4">🇱🇰 Sri Lanka's Best Marketplace</span>
            <h2 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-6 leading-tight">බේ අවශ්‍ය සියල්ල <br><span class="text-blue-600">එක තැනින්!</span></h2>
            <p class="text-gray-600 mb-8 text-lg">Electronics, Fashion, Home Appliances සහ තවත් බොහෝ දේවල් හොඳම මිලට, විශ්වාසවන්තව මිලදී ගන්න.</p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="shop.html" class="bg-blue-600 text-white px-8 py-3.5 rounded-xl text-lg font-bold hover:bg-blue-700 transition shadow-lg transform hover:-translate-y-1">
                    🛍️ දැන්ම Shopping යන්න
                </a>
                <a href="login.html" class="bg-white text-gray-700 border border-gray-300 px-8 py-3.5 rounded-xl text-lg font-bold hover:bg-gray-50 transition">
                    👤 ගිණුමක් සාදන්න
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 text-center p-6 mt-auto text-sm">
        <p>&copy; 2024 Emarket. All rights reserved. | Designed for You</p>
    </footer>

</body>
</html>
